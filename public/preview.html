<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Günlük Planlayıcı</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body { background: #f0f4f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1a2a3a; min-height: 100vh; }

  /* HEADER */
  .header { background: #1a2a3a; color: white; padding: 40px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; }
  .header span { font-size: 11px; letter-spacing: 0.2em; color: rgba(255,255,255,0.5); text-transform: uppercase; }

  /* DATE NAV */
  .date-nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e8eef3; position: sticky; top: 0; z-index: 10; }
  .date-nav button { width: 36px; height: 36px; border-radius: 50%; border: none; background: #e8f2fa; color: #4a7fa5; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .date-nav button:active { background: #4a7fa5; color: white; }
  .date-center { text-align: center; cursor: pointer; }
  .date-center .date-main { font-size: 14px; font-weight: 700; color: #1a2a3a; }
  .date-center .date-sub { font-size: 11px; color: #4a7fa5; font-weight: 600; }

  /* CONTENT */
  .content { padding: 16px; padding-bottom: 90px; }

  /* TIME PLAN CARD */
  .card-blue { background: #c8dde8; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .card-title { font-size: 13px; font-weight: 900; letter-spacing: 0.18em; text-align: center; color: #1a2a3a; margin-bottom: 12px; text-transform: uppercase; }

  .time-table { background: rgba(255,255,255,0.4); border-radius: 12px; overflow: hidden; }
  .time-row { display: grid; grid-template-columns: 108px 1fr 28px; border-bottom: 1px solid #9bb8ca; min-height: 44px; }
  .time-row:last-child { border-bottom: none; }
  .time-cell { padding: 8px 8px; font-weight: 700; font-size: 11px; color: #1a2a3a; border-right: 1px solid #9bb8ca; background: rgba(255,255,255,0.3); display: flex; align-items: center; cursor: pointer; }
  .time-cell:active { background: rgba(255,255,255,0.6); }
  .tasks-cell { padding: 8px 8px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-height: 44px; }
  .tasks-cell .empty-hint { color: #7a9ab0; font-size: 11px; font-style: italic; align-self: center; }
  .task-tag { display: flex; align-items: center; gap: 5px; }
  .task-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .task-label { font-size: 11px; font-weight: 600; color: #1a2a3a; text-transform: uppercase; line-height: 1.2; }
  .del-cell { display: flex; align-items: center; justify-content: center; cursor: pointer; color: #9bb8ca; font-size: 16px; }
  .del-cell:active { color: #e74c3c; }

  .add-slot-btn { margin-top: 12px; width: 100%; padding: 10px; border-radius: 12px; border: 2px dashed #4a7fa5; background: transparent; color: #4a7fa5; font-size: 13px; font-weight: 700; cursor: pointer; }
  .add-slot-btn:active { background: rgba(74,127,165,0.08); }

  /* TODO CARD */
  .card-teal { background: #4bbfcc; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .card-title-white { font-size: 13px; font-weight: 900; letter-spacing: 0.18em; text-align: center; color: white; margin-bottom: 12px; text-transform: uppercase; }
  .todo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .todo-item { display: flex; align-items: center; gap: 10px; }
  .todo-check { width: 20px; height: 20px; border-radius: 4px; border: 2px solid white; background: transparent; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .todo-check.done { background: white; }
  .todo-check.done::after { content: "✓"; color: #4bbfcc; font-size: 13px; font-weight: 900; }
  .todo-text { flex: 1; font-size: 13px; font-weight: 500; color: white; cursor: pointer; }
  .todo-text.done { text-decoration: line-through; opacity: 0.6; }
  .todo-del { color: rgba(255,255,255,0.6); font-size: 16px; cursor: pointer; background: none; border: none; }
  .todo-del:active { color: white; }
  .add-todo { display: flex; gap: 8px; }
  .add-todo input { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.25); color: white; font-size: 13px; outline: none; }
  .add-todo input::placeholder { color: rgba(255,255,255,0.6); }
  .add-todo input:focus { border-color: white; }
  .add-todo button { padding: 10px 16px; border-radius: 12px; border: none; background: white; color: #4bbfcc; font-weight: 700; font-size: 13px; cursor: pointer; }
  .add-todo button:active { opacity: 0.85; }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e8eef3; display: flex; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); z-index: 100; }
  .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; cursor: pointer; border: none; background: none; font-size: 10px; font-weight: 600; color: #b0bec5; gap: 3px; transition: color 0.15s; }
  .nav-tab.active { color: #4a7fa5; }
  .nav-tab svg { width: 22px; height: 22px; }

  /* ÇALIŞMALAR PAGE */
  .page { display: none; }
  .page.active { display: block; }

  .cat-card { background: #e8e4d8; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .cat-label { font-size: 11px; font-weight: 900; letter-spacing: 0.15em; color: #1a2a3a; margin-bottom: 8px; text-transform: uppercase; }
  .cat-options { display: flex; flex-wrap: wrap; gap: 7px; }
  .cat-opt { padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(74,127,165,0.3); background: white; color: #4a7fa5; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em; }
  .cat-opt.selected { background: #4a7fa5; color: white; border-color: #4a7fa5; }
  .cat-opt:active { transform: scale(0.96); }

  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .notes-card { background: white; border-radius: 16px; padding: 14px; border: 1px solid #e8eef3; }
  .notes-title { font-size: 10px; font-weight: 900; letter-spacing: 0.15em; color: #1a2a3a; text-align: center; margin-bottom: 10px; }
  .dots-col { display: flex; flex-direction: column; gap: 5px; align-items: center; margin-bottom: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ddd; }
  .notes-card textarea { width: 100%; height: 160px; border: none; outline: none; resize: none; font-size: 12px; color: #333; line-height: 1.6; font-family: inherit; background: transparent; }
  .notes-card textarea::placeholder { color: #ccc; }

  .routines-card { background: white; border-radius: 16px; padding: 14px; border: 1px solid #e8eef3; overflow-y: auto; max-height: 360px; }
  .routines-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .routines-title { font-size: 10px; font-weight: 900; letter-spacing: 0.15em; color: #1a2a3a; text-transform: uppercase; }
  .routines-badge { font-size: 11px; font-weight: 700; color: #4a7fa5; background: #e8f2fa; padding: 2px 8px; border-radius: 20px; }
  .routine-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .routine-check { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #ddd; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all 0.15s; }
  .routine-check.done { background: #4a7fa5; border-color: #4a7fa5; }
  .routine-check.done::after { content: "✓"; color: white; font-size: 11px; font-weight: 900; }
  .routine-text { font-size: 11px; color: #1a2a3a; line-height: 1.4; }
  .routine-text.done { text-decoration: line-through; color: #aaa; }
  .routine-num { font-size: 10px; font-weight: 900; color: #4a7fa5; }
  .routine-freq { display: block; font-size: 10px; color: #aaa; margin-top: 1px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; width: 100%; border-radius: 24px 24px 0 0; padding: 20px; box-shadow: 0 -4px 24px rgba(0,0,0,0.15); }
  .modal h3 { font-size: 15px; font-weight: 800; color: #1a2a3a; margin-bottom: 16px; }
  .modal input[type="text"], .modal input[type="time"] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #e0e8f0; background: #f7fafc; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 14px; }
  .modal input:focus { border-color: #4a7fa5; }
  .color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .color-swatch { width: 34px; height: 34px; border-radius: 10px; cursor: pointer; transition: transform 0.15s; border: 3px solid transparent; }
  .color-swatch.selected { transform: scale(1.2); outline: 3px solid currentColor; outline-offset: 2px; }
  .modal-label { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 0.12em; margin-bottom: 8px; }
  .modal-btns { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px; border-radius: 14px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-cancel { background: #f0f4f7; color: #666; }
  .btn-save { background: #4a7fa5; color: white; }
  .btn-danger { background: #fef2f2; color: #e74c3c; }
  .btn:active { opacity: 0.85; }
  .time-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
</style>
</head>
<body>

<!-- PAGE: GÜNLÜK PLAN -->
<div id="page-plan" class="page active">
  <div class="header">
    <span>TARİH</span>
    <h1>Günlük Plan</h1>
  </div>

  <div class="date-nav">
    <button onclick="changeDate(-1)">&#8249;</button>
    <div class="date-center" onclick="goToday()">
      <div class="date-main" id="display-date"></div>
      <div class="date-sub" id="date-sub">Bugün</div>
    </div>
    <button onclick="changeDate(1)">&#8250;</button>
  </div>

  <div class="content">
    <!-- SAAT PLANI -->
    <div class="card-blue">
      <div class="card-title">GÜNLÜK SAAT PLANI</div>
      <div class="time-table" id="time-table"></div>
      <button class="add-slot-btn" onclick="openAddSlot()">+ Saat Dilimi Ekle</button>
    </div>

    <!-- YAPILACAKLAR -->
    <div class="card-teal">
      <div class="card-title-white">YAPILACAKLAR LİSTESİ</div>
      <div class="todo-list" id="todo-list"></div>
      <div class="add-todo">
        <input type="text" id="todo-input" placeholder="Yeni görev ekle..." onkeydown="if(event.key==='Enter')addTodo()">
        <button onclick="addTodo()">Ekle</button>
      </div>
    </div>
  </div>
</div>

<!-- PAGE: ÇALIŞMALAR -->
<div id="page-calisma" class="page">
  <div class="header">
    <h1>Çalışmalar–Hobiler</h1>
    <span>TARİH</span>
  </div>
  <div class="date-nav">
    <button onclick="changeDate(-1)">&#8249;</button>
    <div class="date-center" onclick="goToday()">
      <div class="date-main" id="display-date2"></div>
      <div class="date-sub" id="date-sub2">Bugün</div>
    </div>
    <button onclick="changeDate(1)">&#8250;</button>
  </div>
  <div class="content">
    <div class="cat-card">
      <div class="cat-label">HOBİ: <span style="font-weight:400;font-size:10px;color:#888">(en fazla 2 seçim)</span></div>
      <div class="cat-options" id="cat-hobi"></div>
    </div>
    <div class="cat-card">
      <div class="cat-label">YAZI:</div>
      <div class="cat-options" id="cat-yazi"></div>
    </div>
    <div class="cat-card">
      <div class="cat-label">YABANCI DİL:</div>
      <div class="cat-options" id="cat-dil"></div>
    </div>
    <div class="cat-card">
      <div class="cat-label">GELİŞİM:</div>
      <div class="cat-options" id="cat-gelisim"></div>
    </div>
    <div class="bottom-row">
      <div class="notes-card">
        <div class="notes-title">DÜŞÜNCE / NOT GÜNLÜĞÜ</div>
        <div class="dots-col">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <textarea id="notes-area" placeholder="Düşüncelerini yaz..." oninput="saveNotes()"></textarea>
      </div>
      <div class="routines-card">
        <div class="routines-header">
          <div class="routines-title">GÜNLÜK<br>RUTİNLER</div>
          <div class="routines-badge" id="routine-badge">0/13</div>
        </div>
        <div id="routines-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-tab active" id="tab-plan" onclick="switchTab('plan')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    Günlük Plan
  </button>
  <button class="nav-tab" id="tab-calisma" onclick="switchTab('calisma')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
    Çalışmalar
  </button>
</nav>

<!-- MODAL: TASK EDIT -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <h3 id="task-modal-title">Görev Ekle</h3>
    <input type="text" id="task-input" placeholder="Görev adı..." onkeydown="if(event.key==='Enter')saveTask()">
    <div class="modal-label">RENK</div>
    <div class="color-row" id="color-row"></div>
    <div class="modal-btns">
      <button class="btn btn-danger" id="task-del-btn" onclick="deleteTask()" style="display:none">Sil</button>
      <button class="btn btn-cancel" onclick="closeModal('task-modal')">İptal</button>
      <button class="btn btn-save" onclick="saveTask()">Kaydet</button>
    </div>
  </div>
</div>

<!-- MODAL: SLOT EDIT -->
<div class="modal-overlay" id="slot-modal">
  <div class="modal">
    <h3>Saati Düzenle</h3>
    <div class="time-pair">
      <div>
        <div class="modal-label">BAŞLANGIÇ</div>
        <input type="time" id="slot-start">
      </div>
      <div>
        <div class="modal-label">BİTİŞ</div>
        <input type="time" id="slot-end">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal('slot-modal')">İptal</button>
      <button class="btn btn-save" onclick="saveSlot()">Kaydet</button>
    </div>
  </div>
</div>

<!-- MODAL: ADD SLOT -->
<div class="modal-overlay" id="addslot-modal">
  <div class="modal">
    <h3>Saat Dilimi Ekle</h3>
    <div class="time-pair">
      <div>
        <div class="modal-label">BAŞLANGIÇ</div>
        <input type="time" id="newslot-start">
      </div>
      <div>
        <div class="modal-label">BİTİŞ</div>
        <input type="time" id="newslot-end">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal('addslot-modal')">İptal</button>
      <button class="btn btn-save" onclick="confirmAddSlot()">Ekle</button>
    </div>
  </div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────
const COLORS = [
  {l:"Mavi",v:"#4a7fa5"},{l:"Altın",v:"#c9a227"},{l:"Kırmızı",v:"#c0392b"},
  {l:"Turuncu",v:"#e08030"},{l:"Mor",v:"#7b5ea7"},{l:"Yeşil",v:"#2e8b57"},
  {l:"Pembe",v:"#c06080"},{l:"Lacivert",v:"#2c3e7a"}
];
const DEFAULT_SLOTS = [
  ["07:00","08:10"],["08:15","09:15"],["12:30","13:30"],["17:45","18:20"],
  ["18:20","20:20"],["20:30","21:45"],["22:00","23:00"],["23:00","24:00"],
  ["00:00","01:00"],["01:00","02:00"],["02:00","03:00"]
];
const ROUTINES = [
  {id:"r1",t:"İmajinasyon",f:"10 dk"},{id:"r2",t:"Düşünce görselleştirme",f:"10 dk"},
  {id:"r3",t:"Altın Oran Nefes Egzersizi",f:"3 günde 1"},{id:"r4",t:"Adım çalışması",f:"günlük"},
  {id:"r5",t:"Ayna çalışması",f:"günlük"},{id:"r6",t:"Yeni kozmik sembol çalışması ve imajinasyonu",f:"günlük"},
  {id:"r7",t:"Renk meditasyonu, her gün yeni renk",f:"günlük"},{id:"r8",t:"Beyaz gürültü dinleme",f:"günlük"},
  {id:"r9",t:"Dokunma, his çalışması",f:"günlük"},{id:"r10",t:"Tat koku, his çalışması",f:"günlük"},
  {id:"r11",t:"Gölge ve korkularla yüzleşme",f:""},{id:"r12",t:"Rüya, duyu değişimi, vizyon detaylı takip ve not alma",f:"günlük"},
  {id:"r13",t:"Verilen araştırma konularına bakma",f:"günlük"}
];
const HOBI = ["KİL","ELMAS BOYAMA","RESİM","MÜZİK"];
const YAZI = ["İÇERİK METNİ","AKIŞ","İMJ KİTAP"];
const DIL  = ["İBRANİCE","RUSÇA","İNGİLİZCE"];
const GEL  = ["VİBE CODİNG","ASTROLOJİ","CREATİVE DİRECTİNG"];

function uid() { return Math.random().toString(36).substr(2,8); }
function dateKey(d) { return d.toISOString().split("T")[0]; }
function fmtDate(k) { const [y,m,d]=k.split("-"); return `${d}.${m}.${y}`; }

// ─── STATE ──────────────────────────────────────────────────────────
let currentDate = dateKey(new Date());
const todayKey  = dateKey(new Date());

function loadPlan(k) {
  const raw = localStorage.getItem("plan_"+k);
  if (raw) return JSON.parse(raw);
  return { date:k, slots: DEFAULT_SLOTS.map(([s,e])=>({id:uid(),s,e,tasks:[]})), todos:[] };
}
function savePlan(p) { localStorage.setItem("plan_"+p.date, JSON.stringify(p)); }
function loadStudy(k) {
  const raw = localStorage.getItem("study_"+k);
  if (raw) return JSON.parse(raw);
  return { date:k, hobi:[], yazi:[], dil:[], gel:[], notes:"", routines:{} };
}
function saveStudy(s) { localStorage.setItem("study_"+s.date, JSON.stringify(s)); }

let plan, study;

// ─── MODAL STATE ────────────────────────────────────────────────────
let editingSlotId = null, editingTaskSlotId = null, editingTaskId = null, selColor = COLORS[0].v;

// ─── INIT ───────────────────────────────────────────────────────────
function init() {
  plan  = loadPlan(currentDate);
  study = loadStudy(currentDate);
  renderDateUI();
  renderTimeTable();
  renderTodos();
  renderCategories();
  renderRoutines();
  document.getElementById("notes-area").value = study.notes||"";
  buildColorRow();
}

// ─── DATE ────────────────────────────────────────────────────────────
function renderDateUI() {
  const d = fmtDate(currentDate);
  document.getElementById("display-date").textContent  = d;
  document.getElementById("display-date2").textContent = d;
  const sub  = document.getElementById("date-sub");
  const sub2 = document.getElementById("date-sub2");
  if (currentDate === todayKey) { sub.textContent = "Bugün"; sub2.textContent = "Bugün"; }
  else { sub.textContent = "Bugüne dön"; sub2.textContent = "Bugüne dön"; }
}
function changeDate(delta) {
  const d = new Date(currentDate+"T00:00:00");
  d.setDate(d.getDate()+delta);
  currentDate = dateKey(d);
  plan  = loadPlan(currentDate);
  study = loadStudy(currentDate);
  renderDateUI(); renderTimeTable(); renderTodos(); renderCategories(); renderRoutines();
  document.getElementById("notes-area").value = study.notes||"";
}
function goToday() { if(currentDate!==todayKey){currentDate=todayKey;changeDate(0);} }

// ─── TIME TABLE ──────────────────────────────────────────────────────
function renderTimeTable() {
  const tbl = document.getElementById("time-table");
  tbl.innerHTML = "";
  plan.slots.forEach(slot => {
    const row = document.createElement("div");
    row.className = "time-row";
    // time cell
    const tc = document.createElement("div");
    tc.className = "time-cell";
    tc.textContent = slot.s+"-"+slot.e;
    tc.onclick = () => openEditSlot(slot.id);
    // tasks cell
    const dc = document.createElement("div");
    dc.className = "tasks-cell";
    if (!slot.tasks.length) {
      const h = document.createElement("span");
      h.className = "empty-hint";
      h.textContent = "Ekle...";
      dc.appendChild(h);
    } else {
      slot.tasks.forEach(task => {
        const t = document.createElement("div");
        t.className = "task-tag";
        t.innerHTML = `<span class="task-dot" style="background:${task.color}"></span><span class="task-label">${task.text}</span>`;
        t.onclick = (e) => { e.stopPropagation(); openEditTask(slot.id, task.id); };
        dc.appendChild(t);
      });
    }
    dc.addEventListener("click", function(e){
      if(e.target===dc || dc.querySelector(".empty-hint")===e.target) openAddTask(slot.id);
    });
    // del cell
    const xc = document.createElement("div");
    xc.className = "del-cell";
    xc.innerHTML = "×";
    xc.onclick = () => { plan.slots = plan.slots.filter(s=>s.id!==slot.id); savePlan(plan); renderTimeTable(); };
    row.append(tc,dc,xc);
    tbl.appendChild(row);
  });
}

function openEditSlot(id) {
  editingSlotId = id;
  const slot = plan.slots.find(s=>s.id===id);
  document.getElementById("slot-start").value = slot.s;
  document.getElementById("slot-end").value   = slot.e;
  openModal("slot-modal");
}
function saveSlot() {
  const slot = plan.slots.find(s=>s.id===editingSlotId);
  slot.s = document.getElementById("slot-start").value;
  slot.e = document.getElementById("slot-end").value;
  savePlan(plan); renderTimeTable(); closeModal("slot-modal");
}
function openAddSlot() { openModal("addslot-modal"); }
function confirmAddSlot() {
  const s = document.getElementById("newslot-start").value;
  const e = document.getElementById("newslot-end").value;
  if (!s||!e) return;
  plan.slots.push({id:uid(),s,e,tasks:[]});
  savePlan(plan); renderTimeTable(); closeModal("addslot-modal");
  document.getElementById("newslot-start").value="";
  document.getElementById("newslot-end").value="";
}

function openAddTask(slotId) {
  editingTaskSlotId = slotId; editingTaskId = null;
  document.getElementById("task-modal-title").textContent = "Görev Ekle";
  document.getElementById("task-input").value = "";
  document.getElementById("task-del-btn").style.display = "none";
  selColor = COLORS[0].v; updateColorRow();
  openModal("task-modal"); setTimeout(()=>document.getElementById("task-input").focus(),100);
}
function openEditTask(slotId, taskId) {
  editingTaskSlotId = slotId; editingTaskId = taskId;
  const slot = plan.slots.find(s=>s.id===slotId);
  const task = slot.tasks.find(t=>t.id===taskId);
  document.getElementById("task-modal-title").textContent = "Görevi Düzenle";
  document.getElementById("task-input").value = task.text;
  document.getElementById("task-del-btn").style.display = "";
  selColor = task.color; updateColorRow();
  openModal("task-modal");
}
function saveTask() {
  const txt = document.getElementById("task-input").value.trim();
  if (!txt) return;
  const slot = plan.slots.find(s=>s.id===editingTaskSlotId);
  if (editingTaskId) {
    const t = slot.tasks.find(t=>t.id===editingTaskId);
    t.text=txt; t.color=selColor;
  } else {
    slot.tasks.push({id:uid(),text:txt,color:selColor});
  }
  savePlan(plan); renderTimeTable(); closeModal("task-modal");
}
function deleteTask() {
  const slot = plan.slots.find(s=>s.id===editingTaskSlotId);
  slot.tasks = slot.tasks.filter(t=>t.id!==editingTaskId);
  savePlan(plan); renderTimeTable(); closeModal("task-modal");
}

// ─── TODOS ──────────────────────────────────────────────────────────
function renderTodos() {
  const list = document.getElementById("todo-list");
  list.innerHTML = "";
  if (!plan.todos.length) {
    list.innerHTML = '<p style="color:rgba(255,255,255,0.5);font-size:13px;text-align:center;padding:4px 0">Henüz görev yok</p>';
    return;
  }
  plan.todos.forEach(todo => {
    const row = document.createElement("div");
    row.className = "todo-item";
    const chk = document.createElement("div");
    chk.className = "todo-check"+(todo.completed?" done":"");
    chk.onclick = () => { todo.completed=!todo.completed; savePlan(plan); renderTodos(); };
    const txt = document.createElement("div");
    txt.className = "todo-text"+(todo.completed?" done":"");
    txt.textContent = todo.text;
    const del = document.createElement("button");
    del.className = "todo-del"; del.textContent = "×";
    del.onclick = () => { plan.todos=plan.todos.filter(t=>t.id!==todo.id); savePlan(plan); renderTodos(); };
    row.append(chk,txt,del); list.appendChild(row);
  });
}
function addTodo() {
  const inp = document.getElementById("todo-input");
  const txt = inp.value.trim(); if(!txt) return;
  plan.todos.push({id:uid(),text:txt,completed:false});
  savePlan(plan); renderTodos(); inp.value="";
}

// ─── CATEGORIES ─────────────────────────────────────────────────────
function renderCat(containerId, options, selected, max, field) {
  const c = document.getElementById(containerId);
  c.innerHTML = "";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "cat-opt"+(selected.includes(opt)?" selected":"");
    b.textContent = opt;
    b.onclick = () => {
      if (selected.includes(opt)) {
        study[field] = selected.filter(o=>o!==opt);
      } else {
        if (max && selected.length>=max) study[field] = [...selected.slice(1),opt];
        else study[field] = [...selected,opt];
      }
      saveStudy(study); renderCategories();
    };
    c.appendChild(b);
  });
}
function renderCategories() {
  renderCat("cat-hobi",   HOBI, study.hobi,  2, "hobi");
  renderCat("cat-yazi",   YAZI, study.yazi,  0, "yazi");
  renderCat("cat-dil",    DIL,  study.dil,   1, "dil");
  renderCat("cat-gelisim",GEL,  study.gel,   0, "gel");
}

// ─── ROUTINES ───────────────────────────────────────────────────────
function renderRoutines() {
  const list = document.getElementById("routines-list");
  list.innerHTML = "";
  let done = 0;
  ROUTINES.forEach((r,i) => {
    const checked = !!study.routines[r.id];
    if(checked) done++;
    const row = document.createElement("div");
    row.className = "routine-item";
    const chk = document.createElement("div");
    chk.className = "routine-check"+(checked?" done":"");
    const txt = document.createElement("div");
    txt.className = "routine-text"+(checked?" done":"");
    txt.innerHTML = `<span class="routine-num">${i+1}. </span>${r.t}${r.f?`<span class="routine-freq">${r.f}</span>`:""}`;
    row.append(chk,txt);
    row.onclick = () => {
      study.routines[r.id] = !study.routines[r.id];
      saveStudy(study); renderRoutines();
    };
    list.appendChild(row);
  });
  document.getElementById("routine-badge").textContent = done+"/"+ROUTINES.length;
}

// ─── NOTES ──────────────────────────────────────────────────────────
function saveNotes() {
  study.notes = document.getElementById("notes-area").value;
  saveStudy(study);
}

// ─── COLOR ROW ──────────────────────────────────────────────────────
function buildColorRow() {
  const row = document.getElementById("color-row");
  COLORS.forEach(c => {
    const b = document.createElement("div");
    b.className = "color-swatch";
    b.style.background = c.v;
    b.dataset.color = c.v;
    b.onclick = () => { selColor=c.v; updateColorRow(); };
    row.appendChild(b);
  });
}
function updateColorRow() {
  document.querySelectorAll(".color-swatch").forEach(b => {
    b.classList.toggle("selected", b.dataset.color===selColor);
    b.style.outlineColor = b.dataset.color===selColor ? b.dataset.color : "transparent";
  });
}

// ─── TABS ───────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("page-"+tab).classList.add("active");
  document.getElementById("tab-"+tab).classList.add("active");
  window.scrollTo(0,0);
}

// ─── MODAL ──────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add("open");
  document.getElementById(id).addEventListener("click", function closeOnBg(e){
    if(e.target===this){closeModal(id);this.removeEventListener("click",closeOnBg);}
  });
}
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

// ─── START ──────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
